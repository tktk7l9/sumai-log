name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN: CI only reads the repository
permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # From gitleaks_<version>_checksums.txt of the release. Update together with the version
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit (a moved tag cannot swap the code); Dependabot keeps
      # the version comment and the hash in step
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # gitleaks-action requires a license for organization accounts, so use the
      # binary directly to make sure it also works on private repositories.
      # The tarball is checked against the release checksum before anything in it runs, and
      # it stays outside the checkout so the scan does not look at the tool itself.
      - name: gitleaks scan
        run: |
          curl -sSfL -o "${RUNNER_TEMP}/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" dir . --no-banner --redact --verbose

      - name: npm audit
        run: npm audit --audit-level=low

      # Check for real data mixed in. CI has no seed.local.json, so here we can only
      # see "whether the script is broken". The actual protection is passing
      # `npm run check:pii` locally (see AGENTS.md).
      - name: Real-data leak check (script health only)
        run: npm run check:pii

      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      # UI layer (components and routes) on jsdom with Testing Library, with its own coverage gate
      - run: npm run test:ui
      # Server-layer tests against the real Workers runtime + D1
      - run: npm run test:server
      # Tests for scripts/lib (the pure part of the seed.local.json -> D1/R2 import)
      - run: npm run test:scripts
      - run: npm run build

      # Prevent schema changes and migrations from getting out of step.
      # If schema.ts was changed but db:generate was forgotten, it fails here.
      - name: drizzle migrations are up to date
        run: |
          npm run db:generate -- --name ci_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::schema.ts changed but no migration was generated. Run 'npm run db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi
