name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # gitleaks-action requires a license for organization accounts, so use the
      # binary directly to make sure it also works on private repositories.
      - name: gitleaks scan
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact --verbose

      - name: npm audit
        run: npm audit --audit-level=low

      # Check for real data mixed in. CI has no seed.local.json, so here we can only
      # see "whether the script is broken". The actual protection is passing
      # `npm run check:pii` locally (see AGENTS.md).
      - name: 実データの混入検査（スクリプトの健全性のみ）
        run: npm run check:pii

      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      # UI layer (components and routes) on jsdom with Testing Library, with its own coverage gate
      - run: npm run test:ui
      # Server-layer tests against the real Workers runtime + D1
      - run: npm run test:server
      # Tests for scripts/lib (the pure part of the seed.local.json -> D1/R2 import)
      - run: npm run test:scripts
      - run: npm run build

      # Prevent schema changes and migrations from getting out of step.
      # If schema.ts was changed but db:generate was forgotten, it fails here.
      - name: drizzle migrations are up to date
        run: |
          npm run db:generate -- --name ci_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::schema.ts の変更に対してマイグレーションが未生成です。'npm run db:generate' を実行してコミットしてください。"
            git status --porcelain drizzle
            exit 1
          fi
