version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    ignore:
      # @cloudflare/vitest-pool-workers が peer vitest@^4.1.0 を要求するため、
      # vitest 系の major 更新は ERESOLVE で入らない（TypeScript 7 は問題なし）。
      # pool 側が vitest 5 に対応したらこの ignore を消す。
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
      npm-major:
        update-types:
          - 'major'
