version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    ignore:
      # @cloudflare/vitest-pool-workers requires peer vitest@^4.1.0, so major updates of
      # the vitest family fail to install with ERESOLVE (TypeScript 7 is fine).
      # Remove this ignore once the pool supports vitest 5.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
      npm-major:
        update-types:
          - 'major'
