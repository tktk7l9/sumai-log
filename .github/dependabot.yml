version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    ignore:
      # The vitest family is held at 4.x. @cloudflare/vitest-plugin (the successor of
      # @cloudflare/vitest-pool-workers, whose peer was vitest@^4.1.0) accepts
      # vitest@^4.1.0 || ^5.0.0, so this ignore can be removed when moving to vitest 5
      # on purpose (TypeScript 7 is fine).
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
      npm-major:
        update-types:
          - 'major'
  # Keeps the commit-pinned actions in ci.yml current (the hash and the version comment)
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns: ['*']
